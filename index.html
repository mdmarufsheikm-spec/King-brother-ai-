<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>King Brother AI</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f0f;color:white;display:flex;flex-direction:column;height:100vh}
header{padding:15px;background:#1a1a1a;text-align:center;font-size:22px;font-weight:bold;border-bottom:2px solid #00ff88}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:15px;max-width:80%}
.user{background:#00ff88;color:black;align-self:flex-end}
.ai{background:#222;align-self:flex-start;border:1px solid #333}
#inputArea{display:flex;padding:10px;background:#1a1a1a;gap:10px}
input{flex:1;padding:12px;border-radius:25px;border:none;background:#2a2a2a;color:white;outline:none}
button{padding:12px 20px;border-radius:25px;border:none;background:#00ff88;color:black;font-weight:bold}
</style>
</head>
<body>
<header>👑 King Brother AI</header>
<div id="chat"><div class="msg ai">আসসালামু আলাইকুম ভাই! আমি King Brother AI, বলো কি হেল্প লাগবে?</div></div>
<div id="inputArea">
<input id="inp" placeholder="মেসেজ লিখো ভাই...">
<button onclick="send()">Send</button>
</div>
<script>
const chat=document.getElementById('chat');
function send(){
 let t=inp.value.trim(); if(!t)return;
 chat.innerHTML+=`<div class="msg user">${t}</div>`;
 inp.value='';
 setTimeout(()=>{
   let replies=["ভাই, একদম বুঝছি! 😎","চিন্তা নাই ভাই, আমি আছি।","ওইটা করে দিচ্ছি ভাই, একটু ওয়েট।","King Brother বলছে - হয়ে যাবে! 👑"];
   let r=replies[Math.floor(Math.random()*replies.length)];
   chat.innerHTML+=`<div class="msg ai">${r}<br><br>তুমি বলেছিলে: ${t}</div>`;
   chat.scrollTop=chat.scrollHeight;
 },600);
 chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()})
</script>
</body>
</html>
